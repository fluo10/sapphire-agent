# Directory containing AGENT.md and MEMORY.md.
# Defaults to the same directory as this config file.
# `workspace_dir` is a top-level key: it must appear before the first
# `[table]` header (such as [matrix] below). Written after one, it
# silently becomes a key of that table instead, and the loader never
# sees it.
# workspace_dir = "~/.config/sapphire-agent"

# ── Layered configuration ────────────────────────────────────────────
# Settings that describe the agent — its system prompt, profiles, memory
# namespaces, providers, digest and heartbeat behaviour — can live in a
# shared file inside the workspace instead of here:
#
#   {workspace_dir}/.sapphire-agent/config.toml
#
# That file is optional. When present its values are used unless this
# host-local file also sets them, in which case this file wins.
#
# It may only set settings that belong to the agent. Credentials
# ([anthropic].api_key, [matrix], [discord], [tools]), bind addresses,
# cache and workspace paths, and STT/TTS model paths are host-local: if
# the workspace file sets one, it is ignored and named in a warning at
# startup. `[room_profile.<n>].devices` is different: it names device
# ids from the workspace device table, not a secret, so the workspace
# layer may set it. The bearer token itself lives only in the
# host-local key file — see "Device key file" below.
#
# [providers.<n>].base_url is host-local too, and deliberately so even
# though a private-network DNS name would work from every host: a
# workspace that could redirect a provider could point it at a hostile
# server, and that server's replies drive tool calls. Declare each
# provider completely here — the shared file may refine `model`,
# `provider_name` and `max_tokens`, not say where the provider lives.
#
# Keep each host-local table complete for the same reason the fallback
# exists: if the shared file is missing or invalid, the agent runs on
# this file alone, so this file has to be valid on its own.
#
# `sapphire-agent verify` prints where each setting's effective value came
# from.

# Disable heartbeat (day-boundary + cron) tasks. Useful for test
# environments that share the same workspace to avoid duplicate tasks.
# heartbeat_enabled = false

# Day-boundary session policy. One of:
#   "reset"   — close the session; next message starts a new one (legacy default)
#   "compact" — keep the session; force-summarize prior-day history into a stub
#   "none"    — no day-boundary action
# session_policy = "compact"

[matrix]
homeserver = "https://matrix.example.com"
access_token = "syt_..."
user_id = "@bot:example.com"
device_id = "DEVICEID"
# Rooms to listen in. Accepts either an array (preferred) or a single string
# via the legacy `room_id` key.
room_ids = ["!roomid:example.com"]
# Messages from users not in this list are silently ignored.
# Leave empty ([]) to allow all users.
allowed_users = ["@you:example.com"]
# E2EE recovery key — obtain from Element → Settings → Security → Secure Backup
recovery_key = "EsT... "
# Where to store matrix-sdk state / crypto DB (default: ~/.local/share/sapphire-agent/matrix)
# state_dir = "~/.local/share/sapphire-agent/matrix"

# Per-room behaviour is configured via [room_profile.<n>] further down,
# not via per-room blocks. A room profile bundles `(profile, namespace,
# session_policy)` and applies to a list of rooms — perfect when several
# rooms share the same setup, and trivial to add API access controls to
# later (see issue #73).

# Periodic log digests. The agent summarises weekly/monthly/yearly activity
# into short importance-ordered bullet lists, stored as YAML frontmatter in
# memory/{weekly,monthly,yearly}/. The top-N items per kind are injected
# into the system prompt so the agent retains long-horizon context.
# [digest]
# daily_items     = 3   # top-N per daily (injected as "This Week's Digests")
# weekly_items    = 3   # top-N per weekly (injected as "This Month's Digests")
# monthly_items   = 5   # top-N per monthly (injected as "This Year's Digests")
# yearly_items    = 5   # top-N per yearly (injected as "Past Years' Digests")
# weekly_enabled  = true
# monthly_enabled = true
# yearly_enabled  = true

[anthropic]
api_key = "sk-ant-..."
# Model to use. Defaults to claude-opus-4-6.
model = "claude-opus-4-6"
# Maximum tokens in the response. Defaults to 8192.
max_tokens = 8192
# System prompt sent at the beginning of every conversation.
system_prompt = "You are a helpful personal assistant."

# ── Additional providers ────────────────────────────────────────────────
# Beyond the built-in Anthropic provider above, you can declare any number
# of OpenAI-compatible endpoints — llama.cpp's `llama-server`, Ollama,
# vLLM, or the OpenAI API itself. Each entry is keyed by a name you choose
# and must specify `type = "openai_compatible"`. The reserved name
# `anthropic` cannot be reused here.
#
# [providers.local]
# type     = "openai_compatible"
# base_url = "http://127.0.0.1:8080/v1"  # llama-server, no trailing /chat/completions
# model    = "gemma-4-31b-it"
# api_key  = ""                          # optional; llama.cpp does not need one
# max_tokens = 4096

# ── Profiles (LLM presets) ──────────────────────────────────────────────
# A profile is a *pure* LLM preset: a provider plus an optional
# refusal-fallback provider. Profiles know nothing about rooms or memory
# namespaces; pairings happen via [room_profile.<n>] (for chat) and
# memory_namespace.<n>.background_profile (for daily-log / digests /
# compaction). Profiles that name an unknown provider cause startup to
# fail.
#
# `fallback_provider` is consulted at runtime: when the primary refuses
# (Anthropic `stop_reason = "refusal"`, OpenAI `finish_reason =
# "content_filter"`, or a recognised apology pattern) or errors out, the
# call is replayed against the named fallback provider.
#
# The conventional `background` profile is the workspace-wide fallback
# for background tasks (daily-log generator, memory compaction, periodic
# digests) when a memory namespace doesn't pin its own.
#
# [profiles.default]
# provider = "anthropic"
#
# [profiles.opus]
# provider = "anthropic"            # use claude-opus-4-7 in [anthropic.model]
#
# [profiles.local]
# provider = "local"
#
# [profiles.background]
# provider          = "anthropic"
# fallback_provider = "local"

# ── Memory namespaces ────────────────────────────────────────────────────
# A memory namespace owns one subtree of `memory/`: its own MEMORY.md
# plus the daily/weekly/monthly/yearly logs and digests. Room profiles
# pin their writes to one namespace; rooms reading the system prompt
# also pull in parent namespaces declared via `include`. Reads chain
# through the include DAG; writes go only to the leaf namespace.
#
# The `default` namespace is implicit (no need to declare it explicitly)
# and is what every config without `[memory_namespace.*]` resolves to.
# `default` is also the migration target — on first startup, an existing
# pre-namespace `memory/{daily,weekly,...}/` tree is auto-moved to
# `memory/default/{...}` so existing workspaces keep working unchanged.
#
# The hierarchy below stacks: a `user_nsfw` room reads `user_nsfw` +
# `user` + `default`, but a bare `default` room sees nothing private.
#
# [memory_namespace.user]
# include = ["default"]
#
# [memory_namespace.user_nsfw]
# include = ["user"]
# # background_profile pins which profile drives this namespace's
# # daily-log generation, periodic digests, and MEMORY.md compaction.
# # Routes an NSFW namespace directly to a permissive local model
# # instead of bouncing through Anthropic refusal-fallback every day.
# # Resolution: this field > global [profiles.background] > plain
# # Anthropic.
# background_profile = "local"

# ── Room profiles ───────────────────────────────────────────────────────
# A room profile bundles a chat profile + memory namespace + session
# policy and applies to a list of rooms (Matrix room_ids, Discord
# channel ids, etc). Each room_id may appear in at most one room
# profile. Rooms not listed anywhere fall back to [room_profile.default]
# if defined, otherwise the built-in defaults (Anthropic provider,
# `default` namespace, global session_policy).
#
# API sessions pin a room profile via the bearer token sent in
# `Authorization: Bearer <token>` on every `/rpc` request. The token
# resolves to a device (`sapphire-agent device add`, see "Device key
# file" below), and that device's id must appear in some
# `[room_profile.<n>].devices` below — same mechanism `/a2a`, `/acp`,
# `/mcp` and ambient ingest all use (sapphire-call: `[server].token` or
# `--token <TOKEN>`).
#
# [room_profile.everyday]
# profile          = "default"
# memory_namespace = "default"     # optional; defaults to "default"
# session_policy   = "reset"       # optional; defaults to global setting
# rooms            = ["!chat:example.com"]
#
# [room_profile.development]
# profile = "opus"                 # higher-quality model for coding work
# rooms   = ["!dev:example.com", "!code:example.com"]
# # memory_namespace omitted → writes to "default" alongside everyday chat
#
# [room_profile.private_nsfw]
# profile          = "local"
# memory_namespace = "user_nsfw"
# session_policy   = "compact"
# rooms            = ["!nsfw:example.com"]
#
# /rpc (sapphire-call), A2A (Agent2Agent Protocol), MCP clients, `/acp`
# and ambient ingest all reach a room_profile through devices declared
# here. Each device id must be unique across all room profiles —
# startup fails if two profiles share one, and also if a live device is
# in the workspace device table but bound to none — and an incoming
# `Authorization: Bearer <token>` resolves implicitly (token -> device
# -> room profile), so external clients never name room_profile
# themselves. Leave `devices = []` (or omit) to deny external access to
# a profile.
#
# Every device id here comes from `sapphire-agent device add`, which
# prints the id to mint — a 7-character grain-id — on stderr alongside
# the token (printed alone to stdout, so `device add ... > token.txt`
# captures just the secret). See "Device key file" below.
#
# [room_profile.sapphire_world]
# profile          = "default"
# memory_namespace = "sapphire_world"
# rooms            = []             # A2A-only; no chat rooms map here
# devices          = ["a3f9k2p"]    # id printed by `device add --name a2a-client`
#
# A typical MCP setup for an external coding assistant (Claude Code
# and similar) sharing the user's default memory namespace. The
# profile pin is what the ねぎらい reply for `write_report` uses; pick
# whichever model you want responding to project reports.
#
# [room_profile.claude_code]
# profile          = "default"
# memory_namespace = "default"      # share the everyday namespace
# rooms            = []             # MCP-only; no chat rooms map here
# devices          = ["k7d2m9x"]    # id printed by `device add --name claude-code`
#
# Caveat: workspace retrieve (FTS / vector search) currently spans every
# namespace because the agent's retrieve tools don't yet set the
# framework's path_prefix filter.
# Contamination prevention is digest- and MEMORY.md-only in this
# release; retrieve hits may still leak across namespaces.

# ─────────────────────────────────────────────────────────────────────
# A2A (Agent2Agent Protocol) server (optional)
# ─────────────────────────────────────────────────────────────────────
# Mounts `/a2a` (JSON-RPC) and `/.well-known/agent-card.json` on the
# same HTTP server as `/rpc`. Disabled by default — flip `enabled` to
# turn the routes on. Auth resolves through the same device table as
# every other endpoint: token -> device -> `[room_profile.<n>].devices`;
# this section configures only the public face of the agent.
#
# [a2a]
# enabled           = true
# public_url        = "https://agent.example.com/a2a"
# agent_name        = "Sapphire"
# agent_description = "Personal partner AI with persistent character and memory."

# ─────────────────────────────────────────────────────────────────────
# MCP (Model Context Protocol) server
# ─────────────────────────────────────────────────────────────────────
# Mounts `/mcp` (JSON-RPC) on the same HTTP server as `/rpc`. Always
# enabled — there's no `[mcp]` block — but gated entirely by the device
# table: without a device bound to a room profile's `devices`, every
# request returns 401. See the `[room_profile.claude_code]` example
# above for the typical wiring.
#
# Two tools are exposed:
#
#   - `write_report` — external AI clients (Claude Code, etc.) report
#     a unit of work back. Stored per-project under
#     `sessions/<namespace>/mcp/<ULID>.jsonl`; the response is a
#     ねぎらい (acknowledgement) generated through the room_profile's
#     `profile`.
#   - `recall_memory` — fetch a project's compact summary + recent
#     reports at session start, so the external AI can pick up where
#     the user left off (possibly across hosts).
#
# Trust boundary is asymmetric: writes flow into the namespace's
# daily-digest pipeline normally, but `recall_memory` is scoped
# strictly to the named project's session — namespace-wide memory
# never leaks back to the external AI.

# ─────────────────────────────────────────────────────────────────────
# Built-in tools and MCP client (optional)
# ─────────────────────────────────────────────────────────────────────
# The `[tools]` table configures the agent's own tool belt. Two
# concerns live here:
#
#   - `tavily_api_key` — enables the `web_search` tool. Omit to leave
#     the tool unregistered.
#   - `[[tools.mcp_servers]]` — outbound MCP client. Connects to
#     external MCP servers and exposes their tools to the agent as
#     `mcp__<name>__<tool_name>`. Distinct from the inbound MCP
#     server block above: that lets external AIs call sapphire-agent;
#     this lets sapphire-agent call external MCP servers.
#
# Each `[[tools.mcp_servers]]` entry has a `name` (used as the tool
# prefix) and a `type` selecting one of two transports:
#
#   - `type = "http"`  — Streamable HTTP. Fields: `url`, optional
#     `api_key` (sent as Bearer).
#   - `type = "stdio"` — spawn a local child process. Fields:
#     `command`, optional `args`, optional `env` table.
#
# If a server fails to connect at startup the agent logs a warning
# and continues without its tools — startup is not aborted.
#
# [tools]
# tavily_api_key = "tvly-..."
#
# # Example: HTTP transport to a remote MCP server.
# [[tools.mcp_servers]]
# name    = "github"
# type    = "http"
# url     = "https://mcp.example.com/mcp"
# api_key = "ghp_..."                       # optional; sent as Bearer
#
# # Example: stdio transport, launching a local server via npx.
# [[tools.mcp_servers]]
# name    = "filesystem"
# type    = "stdio"
# command = "npx"
# args    = ["-y", "@modelcontextprotocol/server-filesystem", "/home/me/work"]
# env     = { NODE_ENV = "production" }     # optional; merged into child env

# ─────────────────────────────────────────────────────────────────────
# Voice pipeline (optional)
# ─────────────────────────────────────────────────────────────────────
# Enables the `voice/pipeline_run` MCP method used by `sapphire-call
# voice`. Each room_profile can opt in via `voice_pipeline = "<name>"`.
# Without these blocks the method returns -32601 "Method not found".
#
# Local STT and TTS require the `voice-sherpa` cargo feature:
#     cargo build --release --features voice-sherpa
# OpenAI TTS works without it — pure HTTP, no native build. The
# `openai_tts` provider talks to OpenAI's `/v1/audio/speech` endpoint
# and to any self-hosted server that speaks the same shape (e.g. an
# Irodori-TTS fork with an OpenAI-compatible shim).
#
# [voice_pipeline.default]
# stt_provider   = "sense_voice"
# tts_provider   = "openai_remote"
# language       = "ja"             # BCP-47 hint; client param overrides
# capture_max_ms = 30000            # server-side hard cap, default 30s
#
# [stt_provider.sense_voice]        # requires --features voice-sherpa
# type   = "sherpa_onnx"
# kind   = "sense_voice"            # multi-lingual zh/en/ja/ko/yue
# model  = "sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17"
# # If `model_dir` is set it takes precedence over the bundle name.
# # model_dir = "~/.local/share/sapphire-agent/voice-models/..."
#
# [stt_provider.mock_stt]           # testing only
# type       = "mock"
# transcript = "test transcript"
#
# [tts_provider.openai_remote]      # OpenAI public endpoint
# type        = "openai_tts"
# api_key_env = "OPENAI_API_KEY"    # required for the public endpoint
# # base_url defaults to https://api.openai.com
# # model    = "tts-1"              # or "tts-1-hd"
# # voice    = "alloy"              # alloy / echo / fable / onyx / nova / shimmer
#
# [tts_provider.openai_selfhosted]  # any OpenAI-compatible self-hosted shim
# type     = "openai_tts"
# base_url = "https://irodori-tts-api.example.net"
# # api_key_env omitted → no Authorization header sent
# # model / voice: pass through whatever the fork's catalogue defines
#
# [tts_provider.vits_ja]            # local TTS, requires --features voice-sherpa
# type   = "sherpa_onnx"
# kind   = "vits"
# model  = "vits-melo-tts-zh_en"    # placeholder — pick a ja-capable VITS bundle
# speaker_id = 0
# speed      = 1.0
#
# [tts_provider.mock_tts]           # synthetic sine wave; testing only
# type         = "mock"
# duration_ms  = 200
# frequency_hz = 440
#
# [room_profile.home_voice]
# profile          = "casual"
# voice_pipeline   = "default"
# rooms            = []             # MCP-only; not bound to chat rooms
#
# # ── Voice-mode global settings ───────────────────────────────────────
# # AI-name wake words can't be served by pre-trained KWS bundles
# # (their vocabulary is finite), so custom openWakeWord ONNXes are
# # the only path. Train externally with
# # https://github.com/dscripka/openWakeWord, drop the .onnx on the
# # server, point `wake_word_model` at it, restart. Every connected
# # satellite fetches the bytes via voice/config and caches by SHA-256.
# [voice]
# wake_word_model = "/srv/sapphire/wake-models/saphina-v1.onnx"

# ─────────────────────────────────────────────────────────────────────
# Ambient audio ingest (optional)
# ─────────────────────────────────────────────────────────────────────
# A wearable/pendant device POSTs short audio segments to
# `POST /audio/ingest`, mounted on the same HTTP server as `/rpc` only
# once this subsystem actually starts. Disabled by default: with
# `[ambient].enabled = false` the route is not mounted at all, so it
# answers 404 like any other unmatched path — a device probing for the
# feature isn't told its key is wrong (401), the same distinction `/a2a`
# and `/mcp` preserve, just reached by router omission here rather than
# by a handler that refuses while still being mounted.
#
# This is a **recording** pipeline, not a conversational one: segments
# are re-gated, transcribed, attributed to a speaker, and stored — no
# LLM turn runs over them. `transcript_read`, `speaker_candidates` and
# `speaker_promote` (registered as agent tools once this starts) are
# how a normal chat turn reads back what was overheard.
#
# Requires the `voice-sherpa` cargo feature (on by default) for the
# Silero VAD re-gate and the speaker-embedding model — same feature
# the local STT/TTS providers above need.
#
# ── Wire format ──
# `curl` or a microcontroller can speak this directly: raw audio in
# the body, everything else in the query string, so there is no JSON
# framing (and no base64 inflation) around a multi-kilobyte payload.
#
#   POST /audio/ingest?segment=<id>&started_at=<unix_ms>&rate=16000&live=1
#   Authorization: Bearer <token from `sapphire-agent device add`, see below>
#   Content-Type: audio/L16   (raw s16le)  — or: audio/wav
#   <raw audio bytes>
#
#   - `segment`    — device-chosen idempotency key; a replay is
#                    accepted and silently discarded, not an error.
#   - `started_at` — when the audio was *recorded*, Unix ms. Replayed
#                    spool (after a device reconnects) keeps its
#                    original timestamp here.
#   - `rate`       — must be 16000; the server never resamples.
#   - `live`       — 1 for realtime audio, 0 for replayed spool. Only
#                    `live=1` can ever reach a future conversational
#                    path (S4) — replayed audio is recorded, never
#                    answered, no matter how it is marked otherwise.
#   - `audio/wav`  — must already be 16 kHz mono 16-bit PCM; other
#                    bit depths are rejected outright rather than
#                    silently reinterpreted.
#
# `POST /audio/hello` (same bearer auth, no body) answers with the
# resolved device name and accepted parameters — a device can probe
# this once at boot to confirm its credentials and the expected format
# before it starts spooling audio.
#
# [ambient]
# enabled              = true
# # Root of the workspace-external cache for raw audio + speaker data
# # (transcripts, unlike audio, are kept forever — only the audio blobs
# # get swept). Defaults to `dirs::cache_dir()/sapphire-agent/ambient`.
# cache_dir            = "/var/cache/sapphire-agent/ambient"
# audio_retention_days = 7          # raw audio swept after this many days
# stt_provider         = "sense_voice"   # names a [stt_provider.<n>] block above
# min_embed_ms         = 1500       # below this, a segment gets a transcript but no speaker
# match_threshold      = 0.55       # cosine-similarity floor for a speaker match
# promote_after_seconds = 60        # both thresholds must clear before an
# promote_after_days    = 2         # auto-enrolled voice is promoted into voices/
# max_queue            = 1000       # admission queue depth; full queue answers 429
#
# # Silero VAD re-gate and the speaker-embedding model: sherpa-onnx
# # publishes both only as bare `.onnx` files, never as a downloadable
# # bundle name, so — unlike the STT/TTS providers above — there is no
# # auto-download for these two. Fetch them yourself from the
# # sherpa-onnx GitHub releases page and point these at the directory
# # you saved them in:
# #   - vad_model_dir:       the `asr-models` release tag (silero_vad.onnx)
# #   - embedding_model_dir: the `speaker-recongition-models` release tag
# #     (upstream's own spelling) — pick a 3D-Speaker or CAM++ bundle
# vad_model_dir         = "/srv/sapphire/ambient-models/silero-vad"
# embedding_model_dir   = "/srv/sapphire/ambient-models/3dspeaker"
# vad_threshold         = 0.5
# embedding_num_threads = 2
#
# Reference audio for a *named* speaker lives inside the workspace at
# `voices/<name>/*.wav` — drop a clean sample there and restart (or
# just wait for auto-enrolment + `speaker_promote`, see below).
# Auto-enrolled voices that have not been named live outside the
# workspace, alongside the audio cache.
#
# The directory name is the speaker's *display* name, not their id.
# A promoted voice gets a one-line `voices/<name>/id` file holding
# the id transcripts actually record, so the directory can be renamed
# ("blithe-otter-42" -> "tanaka-san") and everything already recorded
# reads back under the new name with no rewrite pass. A directory you
# create by hand has no `id` file and simply uses its own name as the
# id — safe to rename only before any transcript records from it. Once
# a promoted candidate's grain-id is written into the marker, that
# directory gains an id and becomes rename-safe.

# ── Device key file (host-local) ────────────────────────────────────
# Every authenticated entry point — ambient ingest, `/rpc`, `/a2a`,
# `/acp`, `/mcp` — resolves the same way: bearer token -> key file entry
# -> workspace device -> room profile. The token lives only in
# `sapphire-framework`'s key file — never in this config — so a leaked
# config reveals no credential. `DeviceAuth` holds a snapshot of the key
# file and the device table taken at startup with no reload path, so a
# revoke, rotate, retire, or `[room_profile.*].devices` edit takes effect
# on this agent's next restart, not immediately. Defaults to
# `dirs::config_dir()/sapphire-agent/keys.toml`.
#
# [keys]
# file = "/etc/sapphire/keys.toml"
#
# `sapphire-agent` owns this file's rows; there is normally no reason to
# hand-edit it. It is written only by:
#
#   sapphire-agent device add --name pendant --description "the one on the lanyard"
#   sapphire-agent device rotate <name-or-id>
#   sapphire-agent device retire <name-or-id> [--purge]
#
# `device add` prints the freshly minted token to stdout ONLY (safe to
# pipe: `device add --name pendant > pendant.token`), and everything
# else — the device id, timestamps, and the `[room_profile.<n>].devices`
# line to paste — to stderr.

# ── Devices (owned by `sapphire-agent device`, not this file) ────────
# There is no `[device.*]` block here anymore: the device table lives at
# `<workspace_dir>/.sapphire-agent/devices.toml`, next to
# `.sapphire-agent/config.toml`, and is entirely owned by the `device`
# subcommand above — this config only *routes* an existing device id to
# a room profile, via `[room_profile.<n>].devices` (see the room_profile
# examples earlier in this file).
#
# Every device that is not retired must appear in exactly one
# room_profile's `devices` array — startup refuses to run otherwise.
# This includes devices that only ever reach ambient ingest: the moment
# a captured conversation is answered rather than merely recorded, the
# room_profile a device is bound to is what decides which LLM profile
# and which memory namespace that conversation uses, so an ambient-only
# device is not exempt from being routed.

# ── Timer / Pomodoro presets ────────────────────────────────────────
# Single-shot timers ("5分後に教えて") don't need configuration — the
# `timer_set` tool takes minutes + label directly. Presets are for
# multi-step routines like Pomodoro so the user can say "ポモドーロ開始"
# instead of redictating "25分集中 + 5分休憩を3回" every time.
#
# Only ONE timer (single-shot or preset) can be active per process;
# starting a new one cancels the previous. Timers are in-memory and
# reset on restart. When a timer fires the agent is re-invoked to send
# a notification on the same channel it was set from — voice → voice,
# chat → chat, no cross-fallback.

[[timer.preset]]
name   = "pomodoro"
cycles = 4
steps  = [
  { label = "Focus", minutes = 25 },
  { label = "Break", minutes = 5 },
]

# Example: a long-form variant for deep work.
# [[timer.preset]]
# name   = "deep_work"
# cycles = 2
# steps  = [
#   { label = "Focus",      minutes = 50 },
#   { label = "Break",      minutes = 10 },
# ]

# Agent Client Protocol endpoint (GET /acp, WebSocket).
# Lets an ACP client such as Zed drive this agent. Authentication resolves
# through the same device table as every other endpoint (token -> device ->
# room profile via [room_profile.<name>].devices), and the token that
# connects selects the room profile the ACP session runs under.
# Host-local: the workspace config layer cannot set this.
[acp]
enabled = false
