[package]
name = "sapphire-agent-client"
version = "0.8.0"
edition.workspace = true
description = "Shared config + identity helpers for sapphire-agent-cli CLI / desktop clients"
license.workspace = true
repository.workspace = true

[dependencies]
sapphire-agent-core = { path = "../sapphire-agent-core", version = "0.8.0" }

anyhow.workspace = true

# Config file parsing.
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"

# XDG dirs for config / data path resolution.
directories = "6.0"

# Path expansion for ~/... in user-supplied paths.
shellexpand = "3.1"

# UUID v7 for the per-installation device id.
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
